name: Build Unraid module

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      unraid_version:
        description: Target Unraid version label
        required: true
        default: 7.3.2
      kernelrelease:
        description: Expected kernel release from uname -r
        required: false
        default: 6.18.38-Unraid
      source_mode:
        description: "Kernel input mode: ich777, official-zip, or local"
        required: true
        default: ich777
      ich777_image:
        description: Optional ich777/unraid_kernel image/ref for this exact target
        required: false
        default: ''
      ich777_archive_url:
        description: Optional ich777 kernel tarball URL override
        required: false
        default: ''
      ich777_archive_sha256:
        description: Optional ich777 kernel tarball SHA256
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-unraid-module-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build module
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve target kernel
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UNRAID_VERSION: ${{ inputs.unraid_version }}
          INPUT_KERNELRELEASE: ${{ inputs.kernelrelease }}
          INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_ICH777_IMAGE: ${{ inputs.ich777_image }}
          INPUT_ICH777_ARCHIVE_URL: ${{ inputs.ich777_archive_url }}
          INPUT_ICH777_ARCHIVE_SHA256: ${{ inputs.ich777_archive_sha256 }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "schedule" ]; then
            kernelrelease="$(gh api repos/ich777/unraid_kernel/releases/latest --jq '.tag_name')"
            source_mode="ich777"
            unraid_version="auto"
            ich777_image=""
            release_tag="kernel-${kernelrelease}"
            artifact_name="arctic-fan-controller-${kernelrelease}"

            if gh release view "${release_tag}" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "${artifact_name}.zip"; then
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              echo "kernelrelease=${kernelrelease}" >> "${GITHUB_OUTPUT}"
              echo "Existing release asset ${artifact_name}.zip; skipping scheduled build."
              exit 0
            fi
          else
            kernelrelease="${INPUT_KERNELRELEASE}"
            source_mode="${INPUT_SOURCE_MODE:-ich777}"
            unraid_version="${INPUT_UNRAID_VERSION:-manual}"
            ich777_image="${INPUT_ICH777_IMAGE}"
            release_tag="kernel-${kernelrelease}"
          fi

          [ -n "${kernelrelease}" ] || { echo "kernelrelease is required" >&2; exit 1; }

          archive_url="${INPUT_ICH777_ARCHIVE_URL}"
          archive_sha256="${INPUT_ICH777_ARCHIVE_SHA256}"

          if [ "${source_mode}" = "ich777" ] && [ -z "${archive_url}" ]; then
            asset="linux-${kernelrelease}.tar.xz"
            archive_url="$(gh api "repos/ich777/unraid_kernel/releases/tags/${kernelrelease}" --jq ".assets[] | select(.name == \"${asset}\") | .browser_download_url")"
            archive_sha256="$(gh api "repos/ich777/unraid_kernel/releases/tags/${kernelrelease}" --jq ".assets[] | select(.name == \"${asset}\") | (.digest // \"\") | sub(\"^sha256:\"; \"\")")"
          fi

          [ "${source_mode}" != "ich777" ] || [ -n "${archive_url}" ] || [ -n "${ich777_image}" ] || { echo "could not resolve ich777 archive or image for ${kernelrelease}" >&2; exit 1; }

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "kernelrelease=${kernelrelease}" >> "${GITHUB_OUTPUT}"
          echo "source_mode=${source_mode}" >> "${GITHUB_OUTPUT}"
          echo "unraid_version=${unraid_version}" >> "${GITHUB_OUTPUT}"
          echo "ich777_image=${ich777_image}" >> "${GITHUB_OUTPUT}"
          echo "ich777_archive_url=${archive_url}" >> "${GITHUB_OUTPUT}"
          echo "ich777_archive_sha256=${archive_sha256}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=arctic-fan-controller-${kernelrelease}" >> "${GITHUB_OUTPUT}"

      - name: Install build tools
        if: steps.target.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc make libelf-dev libssl-dev kmod file rsync cpio xz-utils unzip zip squashfs-tools jq

      - name: Refuse local target without uploaded/prestaged kernel tree
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode == 'local'
        run: |
          echo "UNRAID_KERNEL_SOURCE_MODE=local requires a prestaged kernel tree on the runner."
          echo "Use ich777 mode with a known exact image, or extend this workflow to download a trusted kernel-tree artifact."
          exit 1

      - name: Fetch kernel build inputs
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          UNRAID_VERSION: ${{ steps.target.outputs.unraid_version }}
          UNRAID_KERNEL_SOURCE_MODE: ${{ steps.target.outputs.source_mode }}
          EXPECTED_KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
          ICH777_UNRAID_KERNEL_IMAGE: ${{ steps.target.outputs.ich777_image }}
          ICH777_UNRAID_KERNEL_ARCHIVE_URL: ${{ steps.target.outputs.ich777_archive_url }}
          ICH777_UNRAID_KERNEL_ARCHIVE_SHA256: ${{ steps.target.outputs.ich777_archive_sha256 }}
        run: scripts/fetch-kernel.sh

      - name: Prepare kernel tree
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: scripts/prepare-kernel.sh

      - name: Build external module
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: scripts/build-module.sh

      - name: Verify module metadata
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          EXPECTED_KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
        run: scripts/verify-module.sh

      - name: Package release artifact
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/arctic_fan_controller.ko release/
          cp dist/modinfo.txt release/
          cp dist/file.txt release/
          cp build/kernelrelease release/
          cp build/logs/build-module.log release/
          (cd release && sha256sum arctic_fan_controller.ko > arctic_fan_controller.ko.sha256)
          (cd release && zip -r "../${{ steps.target.outputs.artifact_name }}.zip" .)

      - name: Publish GitHub release
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
          ARTIFACT_NAME: ${{ steps.target.outputs.artifact_name }}
        run: |
          set -euo pipefail
          notes="release-notes-${KERNELRELEASE}.md"
          {
            echo "ARCTIC Fan Controller module for Unraid kernel ${KERNELRELEASE}."
            echo
            echo "Built from commit ${GITHUB_SHA}."
            echo
            echo "Kernel source: ich777/unraid_kernel ${KERNELRELEASE}"
            echo
            echo "Module SHA256:"
            cat release/arctic_fan_controller.ko.sha256
          } > "${notes}"

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "ARCTIC Fan Controller for ${KERNELRELEASE}" \
              --notes-file "${notes}"
          fi

          gh release upload "${RELEASE_TAG}" \
            "${ARTIFACT_NAME}.zip" \
            release/arctic_fan_controller.ko \
            release/arctic_fan_controller.ko.sha256 \
            --clobber

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name || 'arctic-fan-controller-skipped' }}
          path: |
            dist/**
            release/**
            arctic-fan-controller-*.zip
            build/logs/**
            build/kernelrelease
          if-no-files-found: ignore

name: Build Unraid module

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      unraid_version:
        description: Target Unraid version label
        required: true
        default: 7.3.2
      kernelrelease:
        description: Expected kernel release from uname -r
        required: false
        default: 6.18.38-Unraid
      source_mode:
        description: "Kernel input mode: ich777 or local"
        required: true
        default: ich777
      ich777_image:
        description: Optional ich777/unraid_kernel image/ref for this exact target
        required: false
        default: ''
      ich777_archive_url:
        description: Optional ich777 kernel tarball URL override
        required: false
        default: ''
      ich777_archive_sha256:
        description: Optional ich777 kernel tarball SHA256
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-unraid-module-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.kernelrelease || 'scheduled' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build module
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve target kernel
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UNRAID_VERSION: ${{ inputs.unraid_version }}
          INPUT_KERNELRELEASE: ${{ inputs.kernelrelease }}
          INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_ICH777_IMAGE: ${{ inputs.ich777_image }}
          INPUT_ICH777_ARCHIVE_URL: ${{ inputs.ich777_archive_url }}
          INPUT_ICH777_ARCHIVE_SHA256: ${{ inputs.ich777_archive_sha256 }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "schedule" ]; then
            kernelrelease="$(gh api repos/ich777/unraid_kernel/releases/latest --jq '.tag_name')"
            source_mode="ich777"
            unraid_version="auto"
            ich777_image=""
            release_tag="kernel-${kernelrelease}"
            artifact_name="arctic-fan-controller-${kernelrelease}"

            assets="$(gh release view "${release_tag}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "${assets}" | grep -Fxq "${artifact_name}.zip" && \
               printf '%s\n' "${assets}" | grep -Fxq "arctic_fan_controller.ko" && \
               printf '%s\n' "${assets}" | grep -Fxq "arctic_fan_controller.ko.sha256" && \
               printf '%s\n' "${assets}" | grep -Fxq "build-manifest.json"; then
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              echo "kernelrelease=${kernelrelease}" >> "${GITHUB_OUTPUT}"
              echo "Existing complete release assets for ${release_tag}; skipping scheduled build."
              exit 0
            fi
          else
            kernelrelease="${INPUT_KERNELRELEASE}"
            source_mode="${INPUT_SOURCE_MODE:-ich777}"
            unraid_version="${INPUT_UNRAID_VERSION:-manual}"
            ich777_image="${INPUT_ICH777_IMAGE}"
            release_tag="kernel-${kernelrelease}"
          fi

          [ -n "${kernelrelease}" ] || { echo "kernelrelease is required" >&2; exit 1; }

          archive_url="${INPUT_ICH777_ARCHIVE_URL}"
          archive_sha256="${INPUT_ICH777_ARCHIVE_SHA256}"

          if [ "${source_mode}" = "ich777" ] && [ -z "${archive_url}" ]; then
            asset="linux-${kernelrelease}.tar.xz"
            archive_url="$(gh api "repos/ich777/unraid_kernel/releases/tags/${kernelrelease}" --jq ".assets[] | select(.name == \"${asset}\") | .browser_download_url")"
            archive_sha256="$(gh api "repos/ich777/unraid_kernel/releases/tags/${kernelrelease}" --jq ".assets[] | select(.name == \"${asset}\") | (.digest // \"\") | sub(\"^sha256:\"; \"\")")"
          fi

          if [ "${EVENT_NAME}" = "schedule" ] && [ "${source_mode}" = "ich777" ] && [ -z "${archive_sha256}" ]; then
            echo "scheduled ich777 builds require a GitHub asset SHA256 digest for linux-${kernelrelease}.tar.xz" >&2
            exit 1
          fi

          [ "${source_mode}" != "ich777" ] || [ -n "${archive_url}" ] || [ -n "${ich777_image}" ] || { echo "could not resolve ich777 archive or image for ${kernelrelease}" >&2; exit 1; }

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "kernelrelease=${kernelrelease}" >> "${GITHUB_OUTPUT}"
          echo "source_mode=${source_mode}" >> "${GITHUB_OUTPUT}"
          echo "unraid_version=${unraid_version}" >> "${GITHUB_OUTPUT}"
          echo "ich777_image=${ich777_image}" >> "${GITHUB_OUTPUT}"
          echo "ich777_archive_url=${archive_url}" >> "${GITHUB_OUTPUT}"
          echo "ich777_archive_sha256=${archive_sha256}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=arctic-fan-controller-${kernelrelease}" >> "${GITHUB_OUTPUT}"

      - name: Install build tools
        if: steps.target.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc make libelf-dev libssl-dev kmod file rsync cpio xz-utils unzip zip squashfs-tools jq

      - name: Refuse local target without uploaded/prestaged kernel tree
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode == 'local'
        run: |
          echo "UNRAID_KERNEL_SOURCE_MODE=local requires a prestaged kernel tree on the runner."
          echo "Use ich777 mode with a known exact image, or extend this workflow to download a trusted kernel-tree artifact."
          exit 1

      - name: Fetch kernel build inputs
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          UNRAID_VERSION: ${{ steps.target.outputs.unraid_version }}
          UNRAID_KERNEL_SOURCE_MODE: ${{ steps.target.outputs.source_mode }}
          EXPECTED_KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
          ICH777_UNRAID_KERNEL_IMAGE: ${{ steps.target.outputs.ich777_image }}
          ICH777_UNRAID_KERNEL_ARCHIVE_URL: ${{ steps.target.outputs.ich777_archive_url }}
          ICH777_UNRAID_KERNEL_ARCHIVE_SHA256: ${{ steps.target.outputs.ich777_archive_sha256 }}
          REQUIRE_KERNEL_ARCHIVE_SHA256: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: scripts/fetch-kernel.sh

      - name: Verify vendored upstream driver
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: |
          set -euo pipefail
          upstream_commit="e28d0c73d4d7adc9cd3747d81fdc7338217f9a0c"
          upstream_url="https://raw.githubusercontent.com/torvalds/linux/${upstream_commit}/drivers/hwmon/arctic_fan_controller.c"
          expected_sha256="9082e01f02f7c3e8d348123124f7dec9ac956655b4b004407405f48809af167b"
          mkdir -p build
          curl -L --fail --retry 3 --retry-delay 2 -o build/arctic_fan_controller.upstream.c "${upstream_url}"
          actual_sha256="$(sha256sum driver/arctic_fan_controller.c | awk '{print $1}')"
          upstream_sha256="$(sha256sum build/arctic_fan_controller.upstream.c | awk '{print $1}')"
          [ "${actual_sha256}" = "${expected_sha256}" ] || { echo "vendored driver SHA256 changed: ${actual_sha256}" >&2; exit 1; }
          [ "${upstream_sha256}" = "${expected_sha256}" ] || { echo "pinned upstream driver SHA256 changed: ${upstream_sha256}" >&2; exit 1; }
          cmp -s driver/arctic_fan_controller.c build/arctic_fan_controller.upstream.c
          jq -n \
            --arg repo "torvalds/linux" \
            --arg commit "${upstream_commit}" \
            --arg path "drivers/hwmon/arctic_fan_controller.c" \
            --arg url "${upstream_url}" \
            --arg sha256 "${actual_sha256}" \
            '{repo: $repo, commit: $commit, path: $path, url: $url, sha256: $sha256, vendored_matches_pinned_upstream: true}' \
            > build/upstream-driver.json

      - name: Prepare kernel tree
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: scripts/prepare-kernel.sh

      - name: Build external module
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: scripts/build-module.sh

      - name: Verify module metadata
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          EXPECTED_KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
        run: scripts/verify-module.sh

      - name: Generate build manifest
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
          UNRAID_VERSION: ${{ steps.target.outputs.unraid_version }}
          SOURCE_MODE: ${{ steps.target.outputs.source_mode }}
          ARTIFACT_NAME: ${{ steps.target.outputs.artifact_name }}
        run: |
          set -euo pipefail
          module_sha256="$(sha256sum dist/arctic_fan_controller.ko | awk '{print $1}')"
          module_name="$(modinfo -F name dist/arctic_fan_controller.ko)"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg runner_os "${RUNNER_OS}" \
            --arg runner_arch "${RUNNER_ARCH}" \
            --arg runner_kernel "$(uname -r)" \
            --arg unraid_version "${UNRAID_VERSION}" \
            --arg kernelrelease "${KERNELRELEASE}" \
            --arg source_mode "${SOURCE_MODE}" \
            --arg module_name "${module_name}" \
            --arg module_sha256 "${module_sha256}" \
            --slurpfile kernel_source build/kernel-source.json \
            --slurpfile upstream_driver build/upstream-driver.json \
            '{schema_version: 1, repository: $repository, commit: $commit, ref: $ref, github_run_id: $run_id, github_run_attempt: $run_attempt, runner: {os: $runner_os, arch: $runner_arch, kernel: $runner_kernel}, target: {unraid_version: $unraid_version, kernelrelease: $kernelrelease, source_mode: $source_mode}, upstream_driver: $upstream_driver[0], kernel_source: $kernel_source[0], module: {file: "arctic_fan_controller.ko", name: $module_name, sha256: $module_sha256}, verification: {compile_only: true, runtime_validated: false}}' \
            > build/build-manifest.json

      - name: Package release artifact
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/arctic_fan_controller.ko release/
          cp dist/modinfo.txt release/
          cp dist/file.txt release/
          cp dist/readelf-header.txt release/
          cp dist/undefined-symbols.txt release/
          cp dist/modversions.txt release/
          cp dist/kernel-context.txt release/
          cp build/kernelrelease release/
          cp build/kernel-source.json release/
          cp build/upstream-driver.json release/
          cp build/build-manifest.json release/
          cp build/logs/build-module.log release/
          (cd release && sha256sum arctic_fan_controller.ko > arctic_fan_controller.ko.sha256)
          (cd release && zip -r "../${{ steps.target.outputs.artifact_name }}.zip" .)

      - name: Attest release artifacts
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            ${{ steps.target.outputs.artifact_name }}.zip
            release/arctic_fan_controller.ko
            release/arctic_fan_controller.ko.sha256
            release/build-manifest.json

      - name: Publish GitHub release
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.source_mode != 'local'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          KERNELRELEASE: ${{ steps.target.outputs.kernelrelease }}
          ARTIFACT_NAME: ${{ steps.target.outputs.artifact_name }}
        run: |
          set -euo pipefail
          notes="release-notes-${KERNELRELEASE}.md"
          {
            echo "ARCTIC Fan Controller module for Unraid kernel ${KERNELRELEASE}."
            echo
            echo "Built from repository commit ${GITHUB_SHA}."
            echo
            echo "Compile-time verification only: this release has not been runtime-tested on Unraid hardware."
            echo
            echo "Vendored driver source matches torvalds/linux e28d0c73d4d7adc9cd3747d81fdc7338217f9a0c drivers/hwmon/arctic_fan_controller.c."
            echo
            echo "Kernel source provenance:"
            jq -r 'to_entries[] | "- \(.key): \(.value)"' release/kernel-source.json
            echo
            echo "Module SHA256:"
            cat release/arctic_fan_controller.ko.sha256
            echo
            echo "Release assets are considered complete when all of these exist:"
            echo "- ${ARTIFACT_NAME}.zip"
            echo "- arctic_fan_controller.ko"
            echo "- arctic_fan_controller.ko.sha256"
            echo "- build-manifest.json"
          } > "${notes}"

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "ARCTIC Fan Controller for ${KERNELRELEASE}" \
              --notes-file "${notes}"
          fi

          gh release upload "${RELEASE_TAG}" \
            "${ARTIFACT_NAME}.zip" \
            release/arctic_fan_controller.ko \
            release/arctic_fan_controller.ko.sha256 \
            release/build-manifest.json \
            --clobber

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.target.outputs.artifact_name || 'arctic-fan-controller-skipped' }}
          path: |
            dist/**
            release/**
            arctic-fan-controller-*.zip
            build/logs/**
            build/kernelrelease
            build/*.json
          if-no-files-found: ignore
